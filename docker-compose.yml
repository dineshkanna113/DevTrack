# Full local stack: Postgres + API + web.
#   docker compose up --build
#   docker compose exec api python -m app.seed      # demo data
# Web: http://localhost:5173   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack
      POSTGRES_DB: devtrack
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrack"]
      interval: 5s
      retries: 10

  api:
    build: ./devtrack-backend
    environment:
      DATABASE_URL: postgresql+psycopg://devtrack:devtrack@db:5432/devtrack
      SECRET_KEY: local-dev-secret-not-for-production
      CORS_ORIGINS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./devtrack-frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
